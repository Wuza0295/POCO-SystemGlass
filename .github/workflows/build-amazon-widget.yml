name: Build Amazon Music Widget APK
on:
  push:
    branches: [codex/amazon-music-widget]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools"
      - name: Build widget APK
        run: gradle --no-daemon clean :musicwidget:assembleDebug
      - name: Verify installable APK package
        run: |
          APK=musicwidget/build/outputs/apk/debug/musicwidget-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='de.nachtblau.amazonglass'"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: NachtBlau-Amazon-Music-Widget-APK
          path: musicwidget/build/outputs/apk/debug/musicwidget-debug.apk
          retention-days: 7
