name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: app-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          source = Path("app/build.gradle").read_text()
          match = re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", source)
          if not match:
              raise SystemExit("Could not read versionName from app/build.gradle")
          print(f"version_name={match.group(1)}")
          PY
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK version
        env:
          EXPECTED_VERSION: ${{ steps.app-version.outputs.version_name }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$AAPT" dump badging "$APK" | grep -F "versionName='$EXPECTED_VERSION'"
      - uses: actions/upload-artifact@v4
        with:
          name: POCO-SystemGlass-${{ steps.app-version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
